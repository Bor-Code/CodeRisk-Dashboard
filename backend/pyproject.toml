[project]
name = "coderisk-backend"
version = "0.1.0"
description = "FastAPI backend for CodeRisk Dashboard"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "bcrypt>=4.2.1",
    "fastapi>=0.116.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true
skip_covered = true
