---
name: Feature request
description: Propose an improvement to CodeRisk Dashboard
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or security workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: >-
        Describe the expected behavior without prescribing implementation
        details where possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative approaches have you tried?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Add sanitized examples, mockups, or links that clarify the request.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I did not include secrets or private repository content.
          required: true
