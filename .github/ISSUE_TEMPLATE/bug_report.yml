---
name: Bug report
description: Report a reproducible problem in CodeRisk Dashboard
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CodeRisk Dashboard. Do not include secrets,
        tokens, private source code, or sensitive scan evidence.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start CodeRisk with ...
        2. Scan a repository containing ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Operating system, Python, Node.js, browser, and deployment method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: >-
        Include relevant logs after removing repository content and sensitive
        values.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: >-
            I removed secrets and private repository content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
